# Directories needed
raw_dir: "raw_data"
results_dir: "results"
logs_dir: "logs"
scripts_dir: "scripts"

# Computational resources
threads: 4

# FastP parameters
fastp:
  detect_adapter_for_pe: true
  cut_tail: false
  cut_mean_quality: 20
  qualified_quality_phred: 20
  unqualified_percent_limit: 20
  n_base_limit: 5
  length_requited: 100

# Conda environments
environments:
  qc: "qc_pipeline"
  qiime2: "rachis-qiime2-2026.7"

# DADA2 parameters
dada2:
  trim_left_f: 17
  trim_left_r: 21
  trunc_len_f: 270
  trunc_len_r: 260
  max_ee_f: 2
  max_ee_r: 2
  trunc_q: 2

# Taxonomy Classification Classifier
taxonomy:
  classifier_url: "https://www.arb-silva.de/fileadmin/silva_databases/current/QIIME2/2026.7/SSU/V3V4-341f-806r/uniform/SILVA_144_SSURef_NR99_uniform_classifier_V3V4-341f-806r.qza"
  classifier_file: "resources/classifiers/SILVA_144_SSURef_NR99_uniform_classifier_V3V4-341f-806r.qza"
  confidence: 0.7
